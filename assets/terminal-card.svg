<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%">
  <defs>
    <clipPath id="header-clip">
      <rect x="0" y="0" width="800" height="40" rx="12"/>
    </clipPath>
    <filter id="pill-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Terminal window background -->
  <rect x="0" y="0" width="800" height="520" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/>

  <!-- Header bar -->
  <rect x="0" y="0" width="800" height="40" rx="12" fill="#161b22"/>
  <rect x="0" y="28" width="800" height="12" fill="#161b22"/> <!-- cover bottom rounded corners -->
  <line x1="0" y1="40" x2="800" y2="40" stroke="#30363d" stroke-width="1"/>

  <!-- Window control dots -->
  <circle cx="28" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="50" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="72" cy="20" r="6" fill="#27c93f"/>

  <!-- Header title -->
  <text x="400" y="24" text-anchor="middle" font-family="'SF Mono', 'Fira Code', 'JetBrains Mono', 'Consolas', monospace" font-size="12" fill="#8b949e">zaki@terminal:~$</text>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- CONTENT AREA: Replace all <PLACEHOLDER> values with your info   -->
  <!-- ═══════════════════════════════════════════════════════════════ -->

  <!-- Code greeting -->
  <text x="40" y="80" font-family="'SF Mono', 'Fira Code', 'JetBrains Mono', 'Consolas', monospace" font-size="13" fill="#7ee787">const</text>
  <text x="85" y="80" font-family="'SF Mono', 'Fira Code', 'JetBrains Mono', 'Consolas', monospace" font-size="13" fill="#79c0ff">greeting</text>
  <text x="145" y="80" font-family="'SF Mono', 'Fira Code', 'JetBrains Mono', 'Consolas', monospace" font-size="13" fill="#c9d1d9">=</text>
  <text x="160" y="80" font-family="'SF Mono', 'Fira Code', 'JetBrains Mono', 'Consolas', monospace" font-size="13" fill="#a5d6ff">"Hi 👋"</text>
  <text x="215" y="80" font-family="'SF Mono', 'Fira Code', 'JetBrains Mono', 'Consolas', monospace" font-size="13" fill="#c9d1d9">;</text>

  <!-- Name -->
  <text x="40" y="125" font-family="'SF Mono', 'Fira Code', 'JetBrains Mono', 'Consolas', monospace" font-size="32" font-weight="700" fill="#c9d1d9">I'm </text>
  <text x="115" y="125" font-family="'SF Mono', 'Fira Code', 'JetBrains Mono', 'Consolas', monospace" font-size="32" font-weight="700" fill="#00d4aa">&lt;NAME&gt;</text>

  <!-- Tagline with prompt -->
  <text x="40" y="165" font-family="'SF Mono', 'Fira Code', 'JetBrains Mono', 'Consolas', monospace" font-size="16" fill="#00d4aa">$&gt;</text>
  <text x="68" y="165" font-family="'SF Mono', 'Fira Code', 'JetBrains Mono', 'Consolas', monospace" font-size="16" fill="#7ee787">&lt;TAGLINE&gt;</text>

  <!-- Blinking cursor -->
  <rect x="260" y="150" width="10" height="20" fill="#00d4aa" opacity="1">
    <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite" calcMode="discrete"/>
  </rect>

  <!-- Separator -->
  <line x1="40" y1="190" x2="760" y2="190" stroke="#30363d" stroke-width="1"/>

  <!-- Info rows -->
  <g font-family="'SF Mono', 'Fira Code', 'JetBrains Mono', 'Consolas', monospace" font-size="13">
    <!-- Location -->
    <text x="40" y="225" fill="#8b949e">📍</text>
    <text x="65" y="225" fill="#8b949e">Location:</text>
    <text x="145" y="225" fill="#c9d1d9">&lt;LOCATION&gt;</text>

    <!-- Education -->
    <text x="40" y="255" fill="#8b949e">🎓</text>
    <text x="65" y="255" fill="#8b949e">Education:</text>
    <text x="145" y="255" fill="#c9d1d9">&lt;EDUCATION&gt;</text>

    <!-- Focus -->
    <text x="40" y="285" fill="#8b949e">🎯</text>
    <text x="65" y="285" fill="#8b949e">Focus:</text>
    <text x="125" y="285" fill="#c9d1d9">&lt;FOCUS&gt;</text>

    <!-- Portfolio -->
    <text x="40" y="315" fill="#8b949e">🌐</text>
    <text x="65" y="315" fill="#8b949e">Portfolio:</text>
    <text x="145" y="315" fill="#58a6ff">&lt;PORTFOLIO_URL&gt;</text>

    <!-- Email -->
    <text x="40" y="345" fill="#8b949e">✉️</text>
    <text x="65" y="345" fill="#8b949e">Email:</text>
    <text x="120" y="345" fill="#58a6ff">&lt;EMAIL&gt;</text>
  </g>

  <!-- Skills heading -->
  <text x="40" y="385" font-family="'SF Mono', 'Fira Code', 'JetBrains Mono', 'Consolas', monospace" font-size="13" font-weight="600" fill="#c9d1d9">Skills &amp; Technologies</text>

  <!-- Skill pills -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- Replace skill pills with your actual stack                     -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <g font-family="'SF Mono', 'Fira Code', 'JetBrains Mono', 'Consolas', monospace" font-size="11">
    <!-- Row 1 -->
    <g transform="translate(40, 405)">
      <rect x="0" y="0" width="50" height="24" rx="4" fill="none" stroke="#30363d" stroke-width="1"/>
      <text x="25" y="16" text-anchor="middle" fill="#7ee787">React</text>
    </g>
    <g transform="translate(100, 405)">
      <rect x="0" y="0" width="60" height="24" rx="4" fill="none" stroke="#30363d" stroke-width="1"/>
      <text x="30" y="16" text-anchor="middle" fill="#7ee787">Next.js</text>
    </g>
    <g transform="translate(170, 405)">
      <rect x="0" y="0" width="60" height="24" rx="4" fill="none" stroke="#30363d" stroke-width="1"/>
      <text x="30" y="16" text-anchor="middle" fill="#7ee787">Node.js</text>
    </g>
    <g transform="translate(240, 405)">
      <rect x="0" y="0" width="80" height="24" rx="4" fill="none" stroke="#30363d" stroke-width="1"/>
      <text x="40" y="16" text-anchor="middle" fill="#7ee787">TypeScript</text>
    </g>
    <g transform="translate(330, 405)">
      <rect x="0" y="0" width="60" height="24" rx="4" fill="none" stroke="#30363d" stroke-width="1"/>
      <text x="30" y="16" text-anchor="middle" fill="#7ee787">Python</text>
    </g>
    <g transform="translate(400, 405)">
      <rect x="0" y="0" width="70" height="24" rx="4" fill="none" stroke="#30363d" stroke-width="1"/>
      <text x="35" y="16" text-anchor="middle" fill="#7ee787">Tailwind</text>
    </g>
    <!-- Row 2 -->
    <g transform="translate(40, 437)">
      <rect x="0" y="0" width="70" height="24" rx="4" fill="none" stroke="#30363d" stroke-width="1"/>
      <text x="35" y="16" text-anchor="middle" fill="#79c0ff">PostgreSQL</text>
    </g>
    <g transform="translate(120, 437)">
      <rect x="0" y="0" width="70" height="24" rx="4" fill="none" stroke="#30363d" stroke-width="1"/>
      <text x="35" y="16" text-anchor="middle" fill="#79c0ff">MongoDB</text>
    </g>
    <g transform="translate(200, 437)">
      <rect x="0" y="0" width="40" height="24" rx="4" fill="none" stroke="#30363d" stroke-width="1"/>
      <text x="20" y="16" text-anchor="middle" fill="#79c0ff">Git</text>
    </g>
    <g transform="translate(250, 437)">
      <rect x="0" y="0" width="50" height="24" rx="4" fill="none" stroke="#30363d" stroke-width="1"/>
      <text x="25" y="16" text-anchor="middle" fill="#79c0ff">Docker</text>
    </g>
    <g transform="translate(310, 437)">
      <rect x="0" y="0" width="50" height="24" rx="4" fill="none" stroke="#30363d" stroke-width="1"/>
      <text x="25" y="16" text-anchor="middle" fill="#79c0ff">AWS</text>
    </g>
  </g>

  <!-- Social icons row -->
  <g transform="translate(40, 485)">
    <!-- GitHub -->
    <g transform="translate(0, 0)">
      <circle cx="12" cy="12" r="12" fill="#21262d" stroke="#30363d" stroke-width="1"/>
      <text x="12" y="17" text-anchor="middle" font-family="'SF Mono', monospace" font-size="12" fill="#c9d1d9">⚡</text>
    </g>
    <!-- LinkedIn -->
    <g transform="translate(36, 0)">
      <circle cx="12" cy="12" r="12" fill="#21262d" stroke="#30363d" stroke-width="1"/>
      <text x="12" y="17" text-anchor="middle" font-family="'SF Mono', monospace" font-size="12" fill="#c9d1d9">in</text>
    </g>
    <!-- Twitter/X -->
    <g transform="translate(72, 0)">
      <circle cx="12" cy="12" r="12" fill="#21262d" stroke="#30363d" stroke-width="1"/>
      <text x="12" y="17" text-anchor="middle" font-family="'SF Mono', monospace" font-size="12" fill="#c9d1d9">𝕏</text>
    </g>
    <!-- Website -->
    <g transform="translate(108, 0)">
      <circle cx="12" cy="12" r="12" fill="#21262d" stroke="#30363d" stroke-width="1"/>
      <text x="12" y="17" text-anchor="middle" font-family="'SF Mono', monospace" font-size="12" fill="#c9d1d9">🌐</text>
    </g>
  </g>
</svg>