name: Generate Pac-Man

on:
  schedule:
    - cron: "47 7 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Generate Pac-Man contribution graph SVG
      # Uses github-dark theme to match the dark profile aesthetic.
      # The action outputs to dist/ by default.
      - name: Generate Pac-Man contribution graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: 'pacman'
          gameTheme: 'github-dark'

      # Push generated SVGs from dist/ to the output branch.
      # README references these via raw.githubusercontent.com.
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}