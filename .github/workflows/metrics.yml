name: Metrics

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # ═══════════════════════════════════════════════════════════════
      # 1. GITHUB STATS DASHBOARD
      #    Core profile metrics + community + repositories
      # ═══════════════════════════════════════════════════════════════
      - name: Generate GitHub Stats Dashboard
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.stats.svg
          template: classic
          base: header, activity, community, repositories
          config_timezone: UTC
          config_padding: 0, 8 + 4%
          config_animations: yes
          config_display: large

      # ═══════════════════════════════════════════════════════════════
      # 2. TOP LANGUAGES
      #    Horizontal language distribution with percentages
      # ═══════════════════════════════════════════════════════════════
      - name: Generate Top Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.languages.svg
          template: classic
          base: ""
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%
          plugin_languages_other: no
          config_padding: 0, 8 + 4%
          config_animations: yes

      # ═══════════════════════════════════════════════════════════════
      # 3. ACTIVITY PULSE
      #    How this developer actually works — activity + traffic + lines
      # ═══════════════════════════════════════════════════════════════
      - name: Generate Activity Pulse
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.activity.svg
          template: classic
          base: ""
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 30
          plugin_activity_filter: all
          plugin_activity_visibility: all
          plugin_traffic: yes
          plugin_lines: yes
          plugin_lines_history_limit: 1
          plugin_lines_sections: base
          config_timezone: UTC
          config_padding: 0, 8 + 4%
          config_animations: yes

      # ═══════════════════════════════════════════════════════════════
      # 4. RECENT ACTIVITY
      #    Latest commits, PRs, issues — signal, not noise
      # ═══════════════════════════════════════════════════════════════
      - name: Generate Recent Activity
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.recent.svg
          template: classic
          base: ""
          plugin_activity: yes
          plugin_activity_limit: 8
          plugin_activity_days: 14
          plugin_activity_filter: all
          plugin_activity_visibility: all
          config_timezone: UTC
          config_padding: 0, 8 + 4%
          config_animations: yes